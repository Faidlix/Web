name: Sync Blender add-ons

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-updated]

permissions:
  contents: write

concurrency:
  group: plugin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync versions and downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-plugins.mjs
      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- data/plugins.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json
          git commit -m "自動同步 Blender 外掛版本"
          git push
