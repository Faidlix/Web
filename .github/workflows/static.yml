# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./spendtracker/downloads/*.apk' \
            --exclude='./spendtracker/downloads/*.stpatch' \
            -cf - . | tar -xf - -C _site
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'spendtracker/downloads';
          const release = JSON.parse(fs.readFileSync(path.join(root, 'release.json'), 'utf8'));
          const urls = [release.url, ...(release.patches ?? []).map((patch) => patch.url)];
          for (const url of urls) {
            const name = path.basename(new URL(url, 'https://example.invalid').pathname);
            const source = path.join(root, name);
            const target = path.join('_site', root, name);
            if (!fs.existsSync(source)) throw new Error(`Release artifact is missing: ${source}`);
            fs.copyFileSync(source, target);
          }
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the site and only the APK/patch files referenced by release.json.
          # Keeping historical APKs out prevents the Pages artifact exceeding 1 GB.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
